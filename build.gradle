plugins {
  alias libs.plugins.loom
}

version = mod_version
group = maven_group
base.archivesName = mod_id

dependencies {
  println "Minecraft: $minecraft_version"
  minecraft "com.mojang:minecraft:${minecraft_version}"
  implementation libs.loader

  testImplementation libs.junit
  testImplementation libs.loader.junit
  testImplementation libs.mockito

  implementation fabricApi.module('fabric-resource-loader-v0', fabric_api_version)
  implementation fabricApi.module('fabric-key-mapping-api-v1', fabric_api_version)
}

loom {
  log4jConfigs.from rootProject.file('src/test/resources/log4j.xml')
  runs {
    client.ideConfigGenerated = false
    remove server
  }
}

tasks.named 'runClient', {
  doFirst {
    def run = layout.projectDirectory.dir 'run'
    if (!run.file('options.txt').asFile.exists())
      copy {
        from project.rootProject.file('src/test/resources/options.txt')
        into run
      }
  }
}

java {
  println "Java: $java_version"
  toolchain.languageVersion = JavaLanguageVersion.of java_version
  withSourcesJar()
}

processResources {
  def stringProperties = project.properties.findAll { it.value instanceof String }
  inputs.properties stringProperties
  filesMatching 'fabric.mod.json', {
    expand stringProperties, { escapeBackslash = false }
  }
}

tasks.withType Jar configureEach {
  from rootProject.file('LICENSE')
}

test {
  useJUnitPlatform()
  workingDir = rootProject.layout.buildDirectory.file 'test-run'
  workingDir.mkdir()
}
