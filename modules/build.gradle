allprojects {
  if (project.path.count(':') < 3)
    return

  base.archivesName = "$rootProject.name-$parent.name"

  sourceSets.main {
    java.srcDirs += project.file '../src/main/java'
    java.srcDirs += project.file '../../src/main/java'
    resources.srcDirs += project.file '../src/main/resources'
    resources.srcDirs += project.file '../../src/main/resources'
  }
}
